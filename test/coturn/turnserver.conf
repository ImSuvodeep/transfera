# Coturn configuration for Transfera
listening-port=3478
# TLS port
# tls-listening-port=5349

# Use fingerprint in messages
fingerprint

# Use long-term credential mechanism
lt-cred-mech

# Realm (usually same as domain)
realm=transfera.app

# Static user for testing (format: username:password)
# Recommendation: Use dynamic auth for production
user=transfera:secretpassword

# Listening IPs
# listening-ip=0.0.0.0

# External IP (Crucial for being behind NAT)
# external-ip=YOUR_PUBLIC_IP

# Relay ports
min-port=49152
max-port=65535

# Logs
# log-file=/var/log/turnserver.log
# verbose

# Security: allow only specific protocols
no-stdout-log
no-loopback-peers
no-multicast-peers
